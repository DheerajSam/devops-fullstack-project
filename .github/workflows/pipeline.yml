name: DevOps Fullstack Pipeline

on:
  push:
    branches: [ main ]

env:
  APP_NAME: devops-fullstack-app
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-fullstack-app

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Run Health Check
      run: |
        npm start &
        sleep 5
        curl -f http://localhost:3000/health || exit 1
        kill %1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} .
        docker tag ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} ${{ env.DOCKER_IMAGE }}:latest

    - name: Push to DockerHub
      run: |
        docker push ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}
        docker push ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          kubectl apply -f https://raw.githubusercontent.com/DheerajSam/devops-fullstack-project/main/k8s/deployment.yaml
          kubectl apply -f https://raw.githubusercontent.com/DheerajSam/devops-fullstack-project/main/k8s/service.yaml
          kubectl set image deployment/devops-fullstack-app app=${{ secrets.DOCKERHUB_USERNAME }}/devops-fullstack-app:latest
          kubectl rollout status deployment/devops-fullstack-app
          echo "✅ Deployment complete!"