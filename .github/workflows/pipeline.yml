name: DevOps Fullstack Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  APP_NAME: devops-fullstack-app
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-fullstack-app

jobs:
  # sonarqube-scan:
  #   name: SonarQube Code Quality Scan
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Checkout Code
  #     uses: actions/checkout@v3
  #     with:
  #       fetch-depth: 0

  #   - name: SonarQube Scan
  #     uses: sonarsource/sonarqube-scan-action@master
  #     env:
  #       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    build-test-scan-push:
    name: Build, Test, Scan and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Health Check
        run: |
          npm start &
          APP_PID=$!
          sleep 5
          curl -f http://localhost:3000/health
          kill $APP_PID

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    if: ${{ false }}
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-test-scan-push

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          kubectl apply -f https://raw.githubusercontent.com/DheerajSam/devops-fullstack-project/main/k8s/deployment.yaml
          kubectl apply -f https://raw.githubusercontent.com/DheerajSam/devops-fullstack-project/main/k8s/service.yaml
          kubectl set image deployment/devops-fullstack-app app=${{ secrets.DOCKERHUB_USERNAME }}/devops-fullstack-app:${{ github.sha }}
          kubectl rollout status deployment/devops-fullstack-app
          echo "✅ Deployment complete!"
